<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Dignan</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0;background:#fbfaf8;color:#16181a;font:17px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px}p{margin:0 0 10px}.quiet{color:#6b7075;font-size:15px}</style></head>
<body><main><p id="m">Opening Dignan…</p><p class="quiet" id="q"></p></main>
<script>
// The address that never changes. The Mac's Cloudflare address changes when it restarts; host.json, in this repo,
// always holds the current one (written by Dignan's page). The key travels after the # and never leaves the phone.
(function () {
  // A ticket link from a Things note is ?t=<ticket id>: it carries no key, so the key comes from this browser's memory.
  var t = (new URLSearchParams(location.search).get("t") || "").replace(/[^A-Za-z0-9]/g, "");
  // It may also carry #i<pass>: a pass good for two weeks, minted for that note, so a browser that never opened Dignan
  // (his laptop, 2026-10-26) still gets in. The key this browser holds wins; the pass is used once and never stored.
  var h = location.hash.slice(1), pass = h.charAt(0) === "i" && t ? h.slice(1) : "", key = pass ? "" : h;
  var m = document.getElementById("m"), q = document.getElementById("q");
  try { if (key) localStorage.setItem("k", key); else key = localStorage.getItem("k") || ""; } catch (e) {}
  if (pass && key.length < 40) key = pass;
  if (!/^[A-Za-z0-9_-]{20,}$/.test(key)) { m.textContent = "This browser has not opened Dignan yet."; q.textContent = "Open the ticket from its newest note in Things, or tap the link in the to-do \u201cDignan on my phone\u201d once in this browser."; return; }
  fetch("https://api.github.com/repos/pat5k/dignan/contents/host.json?t=" + Date.now(), { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      if (!/^[a-z0-9.-]+$/.test(d.host || "")) throw new Error("no address");
      location.replace("https://" + d.host + "/k/" + key + (t ? "#" + t : ""));
    })
    .catch(function (e) { m.textContent = "Dignan could not be reached."; q.textContent = "The Mac may be asleep or restarting. Try again in a minute. (" + e.message + ")"; });
})();
</script></body></html>
